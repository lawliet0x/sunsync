project_id = "sunsync"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
[auth.rate_limit]
sign_in_sign_ups = 10
email_sent = 2
token_refresh = 150
[functions.operations]
verify_jwt = false
# Gateway verifies user JWT with auth.getUser. Supports newer signing-key JWTs.
